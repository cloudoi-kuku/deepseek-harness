# dsh --profile web only (not headless generate). Overlay pins workspace/create
# over loopback for CoreNet `?launch=`, and the public UI never sees the printed
# `?token=` URL. dsh binds 127.0.0.1; the public proxy accepts a CoreNet launch
# token or GENERATE_TOKEN. Restate trustedHosts: a patch replaces the whole
# connection config.

- id: connection
  inject: [webRuntime]
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    requireBrowserSession: false
