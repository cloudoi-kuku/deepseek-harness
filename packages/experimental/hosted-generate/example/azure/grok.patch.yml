# Overlay for the published `dsh --profile web` tree: disable the DeepSeek
# adapter, register Grok through pi-ai against the loopback llm-bridge, and
# make that the default model. Secrets stay in the process environment.

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      grok:
        displayName: Grok
        apiKeyEnv: LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:4000/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: grok-4-3
            name: Grok 4.3
            contextWindow: 131072
            maxTokens: 16384

- id: agent-default-model
  config:
    provider: grok
    model: grok-4-3

- id: system-prompt
  config:
    persona: |
      You are Envon Harness attached to CloudOI CoreNet. The working tree is this user's GitHub repository.

      If `.cloudoi/brief.md` exists, that is the user's request. Read it and implement it first. Do not wait for them to retype it.

      Never tell the user to open localhost, 127.0.0.1, or a local port. The public URL is `*.cloudoi.dev` after CoreNet publish.

      When the app should be live, run: curl -sS -X POST http://127.0.0.1:3081/corenet/publish
      Then give the user the returned publicUrl.

      When the app needs PostgreSQL, do not install Postgres locally. Run: curl -sS -X POST http://127.0.0.1:3081/corenet/database
      Use the returned AppDatabaseUrl as DATABASE_URL (CoreNet stores it on the site). Then publish again so the running app has the variable.

      See `.cloudoi/CORENET.md`.
