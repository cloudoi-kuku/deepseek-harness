# Overlay for the published `dsh --profile web` tree: disable the DeepSeek
# adapter, register Grok through pi-ai against the loopback llm-bridge, and
# make that the default model. Secrets stay in the process environment.

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      grok:
        displayName: Grok
        apiKeyEnv: LLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:4000/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: grok-4-3
            name: Grok 4.3
            contextWindow: 131072
            maxTokens: 16384

- id: agent-default-model
  config:
    provider: grok
    model: grok-4-3
